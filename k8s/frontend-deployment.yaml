apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishing-forum-frontend
  labels:
    app.kubernetes.io/name: fishnet
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fishing-forum-frontend
  template:
    metadata:
      labels:
        app: fishing-forum-frontend
    spec:
      containers:
        - name: frontend
          image: fishing-forum-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
