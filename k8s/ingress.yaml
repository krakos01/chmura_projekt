apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fishing-forum-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - fishnet.local
      secretName: fishing-forum-tls
  rules:
    - host: fishnet.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fishing-forum-backend
                port:
                  number: 8080
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: fishing-forum-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fishing-forum-frontend
                port:
                  number: 80