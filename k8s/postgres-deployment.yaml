apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishing-forum-postgres
  labels:
    app.kubernetes.io/name: fishnet
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fishing-forum-postgres
  template:
    metadata:
      labels:
        app: fishing-forum-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "400m"
          env:
            - name: POSTGRES_DB
              value: fishing_forum
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fishing-forum-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fishing-forum-secrets
                  key: DB_PASS
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - forum
                - -d
                - fishing_forum
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - forum
                - -d
                - fishing_forum
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
