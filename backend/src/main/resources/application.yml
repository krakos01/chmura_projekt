server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fishing_forum}
    username: ${DB_USER:forum}
    password: ${DB_PASS:forum}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:dawid-dawid-dawid-dawid-dawid-dawid-dawid}
    expirationMinutes: 120
  upload:
    dir: ${UPLOAD_DIR:uploads}
